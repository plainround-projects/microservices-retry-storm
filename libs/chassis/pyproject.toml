[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chassis"
version = "0.1.0"
description = "Service chassis: settings, JSON logging, W3C trace context and spans, deadline context, metrics, one-attempt upstream calls, health, async PostgreSQL pool."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sumit Srivastava" }]
dependencies = [
    "resilience",
    "fastapi>=0.115",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "psycopg[binary,pool]>=3.2,<4",
]

[tool.uv.sources]
resilience = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chassis = ["py.typed"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --import-mode=importlib"
asyncio_mode = "auto"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["chassis"]
branch = true

[tool.coverage.report]
show_missing = true
